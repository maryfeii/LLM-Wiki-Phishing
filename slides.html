<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="可檢索的網路釣魚知識庫與互動教學簡報"><title>互動教學簡報</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="wrap"><header class="top"><div class="brand">◈ PHISHING / LLM WIKI</div><nav class="nav"><a href="index.html">首頁</a><a href="wiki.html">Wiki 知識庫</a><a href="slides.html">教學簡報</a><a href="workflow.html">Graph／紀錄</a></nav></header><main><section class="slide-stage"><div class="slide-meta"><span id="chapter" class="eyebrow"></span><span id="progress" class="pill"></span></div><article id="slide" class="slide-card" aria-live="polite"><h1 id="stitle"></h1><p id="ssub" class="slide-sub"></p><ul id="bullets"></ul><div id="quiz" class="quiz" hidden><button data-answer="wrong">A · 立即付款</button><button data-answer="correct">B · 官方平台查證</button><button data-answer="wrong">C · 回覆信用卡</button><p id="feedback" class="feedback" aria-live="polite"></p></div><div class="slide-sources"><strong>來源：</strong><span id="refs"></span>　<a href="wiki.html">前往 Wiki 查證 ↗</a></div></article><div class="controls"><button id="prev" aria-label="上一頁">← 上一頁</button><div class="dots" id="dots"></div><button class="primary" id="next" aria-label="下一頁">下一頁 →</button></div><p class="tiny">可使用鍵盤 ← → 切換簡報 · 支援手機瀏覽 · 所有來源都可由 Wiki 回溯</p></section></main><style>.slide-stage{padding:24px 0}.slide-meta,.controls{display:flex;align-items:center;justify-content:space-between;gap:12px}.slide-card{background:linear-gradient(135deg,#15273b,#0e1c2e);border:1px solid #37556a;border-radius:24px;min-height:575px;padding:clamp(24px,5vw,65px);margin:15px 0 22px;display:flex;flex-direction:column}.slide-card h1{font-size:clamp(34px,5.3vw,66px);max-width:850px;margin:10px 0 10px}.slide-sub{font-size:clamp(19px,2.5vw,27px);color:var(--accent);margin:0 0 25px}.slide-card ul{font-size:clamp(17px,2vw,22px);line-height:1.7;list-style:none;padding:0;margin:4px 0 32px}.slide-card li{padding-left:25px;margin:11px 0;position:relative}.slide-card li:before{content:'◆';position:absolute;left:0;color:var(--accent);font-size:12px;top:8px}.slide-sources{margin-top:auto;border-top:1px solid #385267;padding-top:17px;color:var(--muted);font-size:13px}.slide-sources a{margin:0 5px}.dots{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}.dot{width:9px;height:9px;border-radius:50%;background:#3e536a;border:0;padding:0}.dot.active{background:var(--accent);width:21px;border-radius:10px}.quiz{display:flex;flex-wrap:wrap;gap:10px}.quiz[hidden]{display:none}.quiz button{text-align:left}.feedback{width:100%;color:var(--yellow);font-weight:bold}@media(max-width:600px){.slide-card{min-height:650px}.controls{flex-wrap:wrap}.dots{order:3;width:100%}}</style><script>const slides=[{"eyebrow": "先學會停一下", "title": "AI 如何辨識網路釣魚？", "subtitle": "看懂可疑訊息，不再只憑直覺點連結。", "bullets": ["今天會學會：什麼是釣魚、有哪些危險訊號、AI 怎麼輔助、以及如何安全查證。"], "refs": ["S01", "S02"]}, {"eyebrow": "01 / 定義", "title": "什麼是網路釣魚？", "subtitle": "看起來像真的，目的是讓你做錯事。", "bullets": ["釣魚是一種社交工程：假冒可信任機構或人物。", "常見目的：取得密碼、信用卡資訊、付款，或誘導進入假網站。", "重點不是訊息長得多專業，而是它要求你做什麼。"], "refs": ["S01", "S03"]}, {"eyebrow": "02 / 生活情境", "title": "你收到這封「帳號停權」通知", "subtitle": "範例訊息：您的帳號將於 10 分鐘後停權，請立即點連結驗證。", "bullets": ["可疑訊號 A：製造恐慌與時間壓力。", "可疑訊號 B：把登入導向不明連結。", "可疑訊號 C：以官方名義要求敏感資訊。"], "refs": ["S02", "S06"]}, {"eyebrow": "03 / 看懂警訊", "title": "三個值得提高警覺的特徵", "subtitle": "警訊是線索，不是單一證據。", "bullets": ["① 催促：立即操作、否則停權或罰款。", "② 誘導：點擊未知連結、下載檔案、匯款。", "③ 冒充：寄件者名稱像官方，但真實網域或請求不合理。"], "refs": ["S02", "S06"]}, {"eyebrow": "04 / AI 的角色", "title": "AI 可以怎麼協助判斷？", "subtitle": "把文字轉成可解釋的風險訊號。", "bullets": ["輸入：訊息文字與可安全取得的發送資訊。", "分析：偵測緊急語氣、索取敏感資訊、可疑連結或冒充線索。", "輸出：標註風險原因，提示使用者改走官方管道查證。", "這是教學用的分析流程，不是已部署的 AI 分類器。"], "refs": ["S01", "S02", "S06"]}, {"eyebrow": "05 / AI 的限制", "title": "為什麼 AI 也可能判錯？", "subtitle": "自然、流暢的文字也可能是詐騙。", "bullets": ["AI 可能誤判：真實通知也會有「立即」等字樣。", "AI 可能漏判：生成式 AI 能寫出非常自然的詐騙文案。", "沒有完整上下文時，模型無法保證寄件者或網站的真實性。", "最重要：讓 AI 協助提醒，而不是直接取代查證。"], "refs": ["S06", "S02"]}, {"eyebrow": "06 / 安全操作", "title": "收到疑似詐騙訊息怎麼辦？", "subtitle": "停、查、保護。", "bullets": ["停：先不要點訊息內的連結或開啟附件。", "查：自己打開官方 App／網站或撥打已知電話確認。", "保護：開啟多重驗證、更新裝置與瀏覽器安全防護。", "如果已輸入密碼，立即由官方網站修改密碼並採取帳戶保護措施。"], "refs": ["S02", "S04", "S05"]}, {"eyebrow": "07 / 保護機制", "title": "瀏覽器能幫上什麼忙？", "subtitle": "安全警告是多一層防線。", "bullets": ["Google Safe Browsing 可對被辨識的欺騙性網站發出警告。", "Microsoft SmartScreen 可協助攔截已知惡意或釣魚網站。", "沒出現警告，不代表網站就一定安全。"], "refs": ["S03", "S04"]}, {"eyebrow": "08 / 小測驗", "title": "看到這則訊息，你會怎麼做？", "subtitle": "「物流異常！請於 15 分鐘內點網址補繳 25 元。」", "bullets": ["A. 直接點進去付錢，以免包裹退回。", "B. 不點連結，開官方物流平台確認是否真的有訂單。", "C. 把信用卡資料回覆給寄件者。"], "refs": ["S02", "S05"]}, {"eyebrow": "09 / 重點回顧", "title": "三句話記住今天的重點", "subtitle": "讓 AI 提醒你，把確認權留給自己。", "bullets": ["釣魚是利用冒充與誘導行動的社交工程。", "AI 可輔助辨識風險，但輸出不是定論。", "遇到可疑訊息，透過獨立官方管道確認。"], "refs": ["S01", "S02", "S06"]}];let at=0;const el=id=>document.getElementById(id);function show(n){at=Math.min(slides.length-1,Math.max(0,n));let s=slides[at];el('chapter').textContent=s.eyebrow;el('progress').textContent=(at+1)+' / '+slides.length;el('stitle').textContent=s.title;el('ssub').textContent=s.subtitle;el('bullets').innerHTML=s.bullets.map(t=>'<li>'+t+'</li>').join('');el('refs').innerHTML=s.refs.map(r=>'<a href="wiki.html#'+r+'">['+r+']</a>').join(' ');el('prev').disabled=at===0;el('next').textContent=at===slides.length-1?'回到第一頁 ↻':'下一頁 →';el('quiz').hidden=at!==8;el('feedback').textContent='';el('dots').innerHTML=slides.map((_,i)=>'<button class="dot '+(i===at?'active':'')+'" title="第'+(i+1)+'頁" aria-label="前往第'+(i+1)+'頁" data-i="'+i+'"></button>').join('');el('dots').querySelectorAll('button').forEach(b=>b.onclick=()=>show(+b.dataset.i));}el('prev').onclick=()=>show(at-1);el('next').onclick=()=>show((at+1)%slides.length);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show((at+1)%slides.length);if(e.key==='ArrowLeft')show(at-1)});document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{el('feedback').textContent=b.dataset.answer==='correct'?'答對了！請透過獨立官方管道確認，不要直接點訊息附上的連結。':'再想想：可疑訊息中的連結與付款要求不能直接相信。';});show(0);</script><footer class="footer">LLM Wiki 教學作業 · 2026-11-22 · 資料來源：NIST / FTC / Google / Microsoft / FBI · 教學示例，並非真實詐騙偵測服務</footer></div></body></html>
